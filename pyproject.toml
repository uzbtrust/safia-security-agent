[project]
name = "safia-sec"
version = "0.0.1"
description = "Red-vs-Blue gym for a local AI security agent"
requires-python = ">=3.10"
dependencies = ["flask>=3"]

[project.optional-dependencies]
dev = ["pytest>=8", "bandit>=1.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
safia-sec = "safia_sec.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
safia_sec = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
